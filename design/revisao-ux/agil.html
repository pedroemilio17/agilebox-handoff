<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fluxo Ágil · AgileBox</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/app-shell.css">
  <style>
    /* ========================================================================
       Fluxo Ágil — Monocromático, baixo contraste, Lei de Hick (.topic-layout)
       ======================================================================== */
    #page-root {
      display: flex;
      flex-direction: column;
      gap: 0;
      min-width: 0;
      max-width: 100%;
      padding: 0;
    }

    /* Permitir que a coluna direita acomode o quadro de 5 estados confortavelmente */
    #page-root .topic-stage {
      max-width: 100%;
    }

    .topic-panel-narrow {
      max-width: 780px;
    }

    .dot-inline {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex: none;
      display: inline-block;
    }

    .dot-inline.is-danger { background: var(--color-signal-danger); }
    .dot-inline.is-warning { background: var(--color-signal-warning); }
    .dot-inline.is-ok { background: var(--color-signal-ok); }
    .dot-inline.is-muted { background: var(--color-text-subtle); }

    .agil-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--color-divider);
    }

    .agil-context-note {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12.5px;
      color: var(--color-text-muted);
    }

    .agil-notice-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--color-divider);
      font-size: 13px;
      color: var(--color-text-body);
    }

    /* Lista limpa sem caixas aninhadas (divisórias 1px) */
    .clean-list {
      display: flex;
      flex-direction: column;
    }

    .clean-list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--color-divider);
      transition: background 140ms ease;
    }

    .clean-list-row:last-child {
      border-bottom: 0;
    }

    .clean-list-main {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      flex: 1 1 300px;
      min-width: 0;
    }

    .backlog-rank {
      font-family: var(--font-family-mono);
      font-size: 11.5px;
      color: var(--color-text-subtle);
      min-width: 22px;
      font-variant-numeric: tabular-nums;
    }

    .backlog-order-btns {
      display: inline-flex;
      gap: 2px;
      flex: none;
    }

    .order-btn {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--color-text-muted);
      font-size: 13px;
      cursor: pointer;
    }

    .order-btn:hover:not(:disabled) {
      background: var(--color-tint-soft);
      border-color: var(--color-hairline);
      color: var(--color-text-primary);
    }

    .order-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .task-code-mono {
      font-family: var(--font-family-mono);
      font-size: 11.5px;
      color: var(--color-text-subtle);
      flex: none;
    }

    .task-link {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--color-text-primary);
      text-decoration: none;
    }

    .task-link:hover {
      text-decoration: underline;
      text-decoration-color: var(--color-hairline-strong);
      text-underline-offset: 3px;
    }

    .meta-inline {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 12px;
      color: var(--color-text-subtle);
    }

    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .backlog-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      flex: none;
    }

    /* Sprint Ativa */
    .sprint-head-block {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--color-divider);
    }

    .sprint-meta-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 12px;
      color: var(--color-text-muted);
      margin-bottom: 4px;
    }

    .sprint-title {
      margin: 0;
      font-family: var(--font-family-display);
      font-size: 18px;
      font-weight: 650;
      letter-spacing: -0.015em;
      color: var(--color-text-primary);
    }

    .sprint-goal {
      margin: 4px 0 10px;
      font-size: 13px;
      color: var(--color-text-muted);
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .progress-track {
      height: 4px;
      width: 220px;
      max-width: 100%;
      border-radius: 999px;
      background: var(--color-hairline);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--color-text-muted);
      transition: width 260ms var(--ease-ios);
    }

    /* Quadro da Sprint (5 estados na largura da coluna direita, mínimo de caixas) */
    .sprint-board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(138px, 1fr));
      gap: 10px;
      min-width: 0;
    }

    .sprint-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
      min-height: 280px;
      border-radius: 10px;
      background: var(--color-tint-faint);
      border: 1px solid var(--color-hairline);
      padding: 8px 7px;
      transition: border-color 150ms ease, background 150ms ease;
    }

    .sprint-col.is-drop-target {
      border-color: var(--color-hairline-strong);
      background: var(--color-tint-soft);
    }

    .sprint-col-cards {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-height: 120px;
    }

    .sprint-col-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--color-divider);
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text-body);
    }

    .sprint-col-title {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-dot {
      width: 6px;
      height: 6px;
    }

    .sprint-col-count {
      font-family: var(--font-family-mono);
      font-size: 11px;
      color: var(--color-text-subtle);
      font-variant-numeric: tabular-nums;
    }

    .sprint-task-card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 9px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--color-hairline);
      min-width: 0;
      cursor: grab;
      user-select: none;
      transition: border-color 140ms ease, background 140ms ease, opacity 140ms ease;
    }

    .sprint-task-card:active {
      cursor: grabbing;
    }

    .sprint-task-card.is-dragging {
      opacity: 0.45;
    }

    .sprint-task-card[draggable='false'] {
      cursor: default;
    }

    .sprint-task-card:hover {
      border-color: var(--color-hairline-strong);
      background: var(--color-tint-soft);
    }

    .sprint-task-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .sprint-task-title {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--color-text-primary);
      line-height: 1.35;
      word-break: break-word;
    }

    .sprint-task-title:hover {
      text-decoration: underline;
      text-decoration-color: var(--color-hairline-strong);
    }

    .sprint-task-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 11.5px;
      color: var(--color-text-subtle);
      font-variant-numeric: tabular-nums;
    }

    /* Planejamento */
    .plan-cap-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--color-divider);
    }

    /* Burndown discreto */
    .burndown-svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .legend-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 18px;
      padding-top: 8px;
      font-size: 12.5px;
      color: var(--color-text-muted);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .legend-swatch {
      width: 20px;
      height: 2px;
      flex: none;
    }

    .legend-swatch.is-ideal {
      border-top: 2px dashed #716e7c;
      height: 0;
    }

    .legend-swatch.is-real {
      background: #e2e0e8;
    }

    /* Métricas de fluxo em faixa limpa sem caixas pesadas */
    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0;
      border-bottom: 1px solid var(--color-divider);
    }

    @media (max-width: 720px) {
      .kpi-strip {
        grid-template-columns: 1fr;
      }
    }

    .kpi-cell {
      padding: 8px 16px 14px 0;
      border-right: 1px solid var(--color-divider);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .kpi-cell:not(:first-child) {
      padding-left: 16px;
    }

    .kpi-cell:last-child {
      border-right: 0;
      padding-right: 0;
    }

    @media (max-width: 720px) {
      .kpi-cell {
        border-right: 0;
        border-bottom: 1px solid var(--color-divider);
        padding: 10px 0 !important;
      }
      .kpi-cell:last-child {
        border-bottom: 0;
      }
    }

    .kpi-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--color-text-muted);
    }

    .kpi-value {
      font-family: var(--font-family-display);
      font-size: 24px;
      font-weight: 650;
      color: var(--color-text-primary);
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .kpi-hint {
      font-size: 11.5px;
      color: var(--color-text-subtle);
    }

    .clean-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .clean-table th {
      padding: 8px 0;
      text-align: left;
      font-family: var(--font-family-mono);
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: var(--letter-spacing-eyebrow);
      text-transform: uppercase;
      color: var(--color-text-subtle);
      border-bottom: 1px solid var(--color-hairline);
    }

    .clean-table td {
      padding: 10px 0;
      border-bottom: 1px solid var(--color-divider);
      color: var(--color-text-body);
      vertical-align: middle;
    }

    .clean-table tr:last-child td {
      border-bottom: 0;
    }

    .clean-table th.num,
    .clean-table td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      padding-left: 14px;
    }

    /* Filtro discreto de Bloqueios */
    .quiet-switch {
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    .quiet-switch-btn {
      height: 30px;
      padding: 0 10px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--color-text-subtle);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
    }

    .quiet-switch-btn:hover {
      color: var(--color-text-primary);
    }

    .quiet-switch-btn.is-active {
      background: var(--color-tint-soft);
      color: var(--color-text-primary);
    }

    /* Modal Encerrar Sprint */
    .close-sprint-modal {
      width: min(640px, 100%);
    }

    .pending-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--color-divider);
    }

    .pending-item-row:last-child {
      border-bottom: 0;
    }

    .pending-item-row .select {
      width: auto;
      min-width: 185px;
      min-height: 36px;
    }

    .batch-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .topic-layout.is-no-rail {
      grid-template-columns: minmax(0, 1fr);
    }

    .topic-layout.is-no-rail .topic-stage {
      max-width: 960px;
    }
  </style>
  <script src="assets/kan-model-data.js" defer></script>
  <script src="assets/kan-3d.js" defer></script>
  <script src="assets/kan-ai.js" defer></script>
  <script src="assets/app-shell.js" defer></script>
</head>
<body data-page="agil">
  <section id="page-root">
    <header class="ab-page-head">
      <div class="ab-page-head-main">
        <h1 class="ab-page-title" id="agil-page-title">Backlog</h1>
        <p class="ab-page-sub" id="agil-page-subtitle">Organize o que vem a seguir por prioridade e envie ao Quadro ou Sprint em 1 clique.</p>
      </div>
      <div class="ab-page-head-actions" id="agil-page-actions"></div>
    </header>

    <div class="topic-layout" id="agil-topic-layout">
      <nav class="topic-rail" id="agil-topic-rail" aria-label="Tópicos de Sprints"></nav>
      <div class="topic-stage" id="agil-view-root"></div>
    </div>
  </section>

  <!-- Modal: Nova tarefa futura -->
  <div class="modal-backdrop" id="modal-new-backlog" role="dialog" aria-modal="true" aria-labelledby="modal-new-backlog-title">
    <form class="modal" id="form-new-backlog">
      <div class="modal-header">
        <h3 id="modal-new-backlog-title">Nova tarefa futura</h3>
        <button type="button" class="ab-kan-close-btn" data-close-modal="modal-new-backlog" aria-label="Fechar">×</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label class="field-label" for="nb-title">O que precisa ser feito depois?</label>
          <input type="text" class="input" id="nb-title" placeholder="Ex.: Simplificar filtro por cliente no relatório" required>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;">
          <div class="field">
            <label class="field-label" for="nb-priority">Prioridade</label>
            <select class="select" id="nb-priority">
              <option value="Alta">Alta</option>
              <option value="Média" selected>Média</option>
              <option value="Baixa">Baixa</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="nb-est">Estimativa simples</label>
            <select class="select" id="nb-est">
              <option value="2h · Rápida">2h · Rápida</option>
              <option value="4h · Média" selected>4h · Média</option>
              <option value="8h · Grande">8h · Grande</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="nb-owner">Responsável sugerido</label>
          <select class="select" id="nb-owner">
            <option value="Pedro">Pedro</option>
            <option value="Ana">Ana</option>
            <option value="João">João</option>
            <option value="Carlos">Carlos</option>
            <option value="Maria">Maria</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-close-modal="modal-new-backlog">Cancelar</button>
        <button type="submit" class="btn btn-primary">Adicionar ao Backlog</button>
      </div>
    </form>
  </div>

  <!-- Modal: Registrar bloqueio -->
  <div class="modal-backdrop" id="modal-new-block" role="dialog" aria-modal="true" aria-labelledby="modal-new-block-title">
    <form class="modal" id="form-new-block">
      <div class="modal-header">
        <h3 id="modal-new-block-title">Registrar bloqueio</h3>
        <button type="button" class="ab-kan-close-btn" data-close-modal="modal-new-block" aria-label="Fechar">×</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label class="field-label" for="blk-task">Qual tarefa está travada?</label>
          <select class="select" id="blk-task"></select>
        </div>
        <div class="field">
          <label class="field-label" for="blk-reason">O que está impedindo o andamento?</label>
          <textarea class="textarea" id="blk-reason" placeholder="Ex.: Aguardando aprovação de acesso ao ambiente de homologação pelo cliente." required></textarea>
        </div>
        <div class="field">
          <label class="field-label" for="blk-owner">Quem ajuda a destravar?</label>
          <select class="select" id="blk-owner">
            <option value="Carla">Carla (Gestora)</option>
            <option value="Carlos">Carlos (Backend)</option>
            <option value="Pedro">Pedro (Colaborador)</option>
            <option value="Maria">Maria (QA &amp; Testes)</option>
            <option value="Cliente ACME (Externo)">Cliente ACME (Externo)</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-close-modal="modal-new-block">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar bloqueio</button>
      </div>
    </form>
  </div>

  <!-- Modal: Encerrar Sprint -->
  <div class="modal-backdrop" id="modal-close-sprint" role="dialog" aria-modal="true" aria-labelledby="modal-close-sprint-title">
    <div class="modal close-sprint-modal">
      <div class="modal-header">
        <h3 id="modal-close-sprint-title">Encerrar Sprint 14</h3>
        <button type="button" class="ab-kan-close-btn" data-close-modal="modal-close-sprint" aria-label="Fechar">×</button>
      </div>
      <div class="modal-body" id="close-sprint-body"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-close-modal="modal-close-sprint">Voltar</button>
        <button type="button" class="btn btn-primary" id="btn-confirm-close-sprint">Confirmar encerramento da Sprint</button>
      </div>
    </div>
  </div>

              ]
            },

      function esc(str) {
        return String(str)
          .replace(/&/g, '&amp;')

      function getSprintProgress(data) {
        var sp = data.sprint14;
        var doneInBoard = sp.tasks.filter(function (t) { return t.status === 'Concluído'; }).length;
        var totalTasks = Math.max(sp.totalCountBase, sp.tasks.length);
        var doneCount = Math.min(totalTasks, sp.doneTotalBase - 2 + doneInBoard);
        if (state.projectId === 'a' && sp.tasks.length >= 7) {
          doneCount = Math.min(totalTasks, 4 + doneInBoard);
        }
        var pct = totalTasks ? Math.round((doneCount / totalTasks) * 100) : 0;
        return { doneCount: doneCount, totalTasks: totalTasks, pct: pct };
      }

        var plotH = h - padT - padB;
        var maxVal = bd.ideal[0] || 40;
        var steps = bd.ideal.length - 1;

        function xFor(i) { return padL + (plotW * i) / steps; }
        function yFor(v) { return padT + plotH * (1 - v / maxVal); }

        var gridLines = [0, 0.25, 0.5, 0.75, 1].map(function (f) {
          var val = Math.round(maxVal * f);
          var y = yFor(val);
          return (
            '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (w - padR) + '" y2="' + y.toFixed(1) + '" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>' +
            '<text x="' + (padL - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" fill="#716e7c" font-size="10.5" font-family="Geist Mono Variable, monospace">' + val + 'h</text>'
          );
        }).join('');

        var idealPts = bd.ideal.map(function (v, i) { return xFor(i).toFixed(1) + ',' + yFor(v).toFixed(1); }).join(' ');
        var realPtsArr = [];
        var realDots = '';
        bd.real.forEach(function (v, i) {
          if (v === null || v === undefined) return;
          var cx = xFor(i).toFixed(1);
          var cy = yFor(v).toFixed(1);
          realPtsArr.push(cx + ',' + cy);
          realDots += '<circle cx="' + cx + '" cy="' + cy + '" r="3.5" fill="#e2e0e8" stroke="#111015" stroke-width="1.5"><title>' + esc(bd.labels[i]) + ': ' + v + 'h restantes</title></circle>';
        });

        var xLabels = bd.labels.map(function (lbl, i) {
          return '<text x="' + xFor(i).toFixed(1) + '" y="' + (h - 8) + '" text-anchor="middle" fill="#93909e" font-size="10.5">' + esc(lbl) + '</text>';
        }).join('');

        var todayX = xFor(3).toFixed(1);

        return (
          '<div class="topic-panel topic-panel-narrow">' +
            '<section class="topic-section">' +
              '<div class="topic-section-head">' +
                '<h2 class="topic-section-title">Ritmo da sprint (Burndown)</h2>' +
                '<span class="topic-section-meta">14h restantes · ideal 16h</span>' +
              '</div>' +
              '<svg class="burndown-svg" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Gráfico de Ritmo da sprint comparando linha ideal pontilhada cinza e linha real contínua">' +
                gridLines +
                '<line x1="' + todayX + '" y1="' + padT + '" x2="' + todayX + '" y2="' + (h - padB) + '" stroke="rgba(255,255,255,0.22)" stroke-dasharray="4 4" stroke-width="1"/>' +
                '<text x="' + todayX + '" y="' + (padT - 5) + '" text-anchor="middle" fill="#93909e" font-size="10">Hoje</text>' +
                '<polyline fill="none" stroke="#716e7c" stroke-width="1.8" stroke-dasharray="5 5" points="' + idealPts + '"/>' +
                '<polyline fill="none" stroke="#e2e0e8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" points="' + realPtsArr.join(' ') + '"/>' +
                realDots +
                xLabels +
              '</svg>' +
              '<div class="legend-row">' +
                '<span class="legend-item"><span class="legend-swatch is-ideal"></span>Linha ideal (cinza tracejada)</span>' +
                '<span class="legend-item"><span class="legend-swatch is-real"></span>Linha real (trabalho restante)</span>' +
              '</div>' +
            '</section>' +
            '<section class="topic-section">' +
              '<div class="topic-section-head">' +
                '<h2 class="topic-section-title">Como ler o gráfico</h2>' +
              '</div>' +
              '<p class="topic-helper" style="margin:0;color:var(--color-text-body);">Linha real abaixo da pontilhada = ritmo no prazo ou adiantado · Linha acima = há acúmulo ou bloqueios.</p>' +
              '<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--color-text-muted);padding-top:4px;">' +
                '<span class="dot-inline is-ok"></span>' +
                '<span>Hoje (22 nov), a equipe está <strong style="color:var(--color-text-primary);font-weight:600;">2h adiantada</strong> em relação ao ritmo esperado para encerrar em 27 nov.</span>' +
              '</div>' +
            '</section>' +
          '</div>'
        );
      }

      function renderFlowMetrics(data) {
        var fl = data.flow;
        var rowsHtml = fl.columns.map(function (c) {
          var dot = STATE_DOT[c.state] || 'is-afazer';
          var diag = c.warn
            ? '<span class="meta-item" style="color:var(--color-signal-warning-text);"><span class="dot-inline is-warning"></span>' + esc(c.note) + '</span>'

            '<tr>' +
              '<td><span class="meta-item" style="color:var(--color-text-primary);font-weight:500;"><span class="status-dot ' + dot + '"></span>' + esc(c.state) + '</span></td>' +
              '<td class="num">' + c.count + '</td>' +
              '<td class="num"><strong style="color:var(--color-text-primary);font-weight:600;">' + esc(c.avg) + '</strong></td>' +
              '<td>' + diag + '</td>' +
            '</tr>'
          );
        }).join('');

        return (
          '<div class="topic-panel topic-panel-narrow">' +
            '<section class="topic-section">' +
              '<div class="kpi-strip">' +
                '<div class="kpi-cell">' +
                  '<div class="kpi-label">' +
                    '<span class="jargon-tip">Tempo do pedido à entrega' +
                      '<button type="button" class="jargon-tip-btn" aria-label="Explicar Tempo do pedido à entrega">?</button>' +
                      '<span class="jargon-tip-popover" role="tooltip">Antigo Lead Time: tempo total desde quando a tarefa foi pedida até ficar Concluída.</span>' +
                    '</span>' +
                  '</div>' +
                  '<div class="kpi-value">' + esc(fl.leadTime) + '</div>' +
                  '<div class="kpi-hint">Do pedido inicial até Concluído</div>' +
                '</div>' +
                '<div class="kpi-cell">' +
                  '<div class="kpi-label">' +
                    '<span class="jargon-tip">Tempo em execução' +
                      '<button type="button" class="jargon-tip-btn" aria-label="Explicar Tempo em execução">?</button>' +
                      '<span class="jargon-tip-popover" role="tooltip">Antigo Cycle Time: tempo em que a equipe esteve trabalhando ativamente após puxar para Desenvolvendo.</span>' +
                    '</span>' +
                  '</div>' +
                  '<div class="kpi-value">' + esc(fl.cycleTime) + '</div>' +
                  '<div class="kpi-hint">De Desenvolvendo até Concluído</div>' +
                '</div>' +
                '<div class="kpi-cell">' +
                  '<div class="kpi-label">' +
                    '<span class="jargon-tip">Entregas por semana' +
                      '<button type="button" class="jargon-tip-btn" aria-label="Explicar Entregas por semana">?</button>' +
                      '<span class="jargon-tip-popover" role="tooltip">Antigo Throughput (Vazão): média real de tarefas entregues pelas semanas ativas deste projeto.</span>' +
                    '</span>' +
                  '</div>' +
                  '<div class="kpi-value">' + esc(fl.throughput) + '</div>' +
                  '<div class="kpi-hint">Média nas semanas reais do projeto</div>' +
                '</div>' +
              '</div>' +
            '</section>' +
            '<section class="topic-section">' +
              '<div class="topic-section-head">' +
                '<h2 class="topic-section-title">Onde o trabalho fica retido (por etapa)</h2>' +
                '<span class="meta-item" style="font-size:12px;color:var(--color-signal-warning-text);"><span class="dot-inline is-warning"></span>Revisar: 1,6d</span>' +
              '</div>' +
              '<p class="topic-helper">Os 5 estados oficiais mostram em qual coluna as tarefas aguardam mais tempo.</p>' +
              '<table class="clean-table">' +
                '<thead><tr><th>Etapa</th><th class="num">Tarefas</th><th class="num">Tempo médio</th><th>Diagnóstico</th></tr></thead>' +
                '<tbody>' + rowsHtml + '</tbody>' +
              '</table>' +
            '</section>' +
          '</div>'
        );
      }

      function renderBlocks(data) {
        var activeCount = data.blocks.filter(function (b) { return !b.resolved; }).length;
        var filtered = data.blocks.filter(function (b) {
          if (state.blockFilter === 'ativos') return !b.resolved;
          if (state.blockFilter === 'resolvidos') return b.resolved;
          return true;
        });

        var listHtml = filtered.length
          ? '<div class="clean-list">' + filtered.map(function (b) {
              return (
                '<div class="clean-list-row" style="align-items:flex-start;">' +
                  '<div style="display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 300px;">' +
                    '<div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;">' +
                      '<span class="dot-inline ' + (b.resolved ? 'is-ok' : 'is-danger') + '"></span>' +
                      '<span class="task-code-mono">' + esc(b.taskId) + '</span>' +
                      '<a class="task-link" href="tarefa.html?id=' + encodeURIComponent(b.taskId) + '">' + esc(b.taskTitle) + '</a>' +
                    '</div>' +
                    '<p style="margin:0;font-size:13px;color:var(--color-text-body);">' + esc(b.reason) + '</p>' +
                    '<div class="meta-inline">' +
                      '<span>Responsável: <strong style="color:var(--color-text-body);font-weight:500;">' + esc(b.owner) + '</strong></span>' +
                      '<span>· ' + esc(b.age) + '</span>' +
                    '</div>' +
                  '</div>' +
                  '<div style="display:flex;gap:8px;align-items:center;">' +
                    (!b.resolved
                      ? '<button type="button" class="btn btn-secondary btn-sm" data-resolve-block="' + esc(b.id) + '">Marcar resolvido</button>'
                      : '<span class="topic-section-meta">Resolvido</span>') +
                  '</div>' +
                '</div>'
              );
            }).join('') + '</div>'
          : '<div class="empty-state"><h3>Nenhum bloqueio nesta visão</h3><p>Tudo fluindo neste projeto. Se surgir algum impedimento, registre aqui em segundos.</p></div>';

        return (
          '<div class="topic-panel topic-panel-narrow">' +
            '<div class="agil-toolbar">' +
              '<div class="quiet-switch" role="group" aria-label="Filtrar bloqueios">' +
                '<button type="button" class="quiet-switch-btn' + (state.blockFilter === 'ativos' ? ' is-active' : '') + '" data-block-filter="ativos">Ativos (' + activeCount + ')</button>' +
                '<button type="button" class="quiet-switch-btn' + (state.blockFilter === 'resolvidos' ? ' is-active' : '') + '" data-block-filter="resolvidos">Resolvidos</button>' +
                '<button type="button" class="quiet-switch-btn' + (state.blockFilter === 'todos' ? ' is-active' : '') + '" data-block-filter="todos">Todos</button>' +
              '</div>' +
            '</div>' +
            listHtml +
          '</div>'
        );
      }

      function render() {
        var data = getCurrentData();
        syncHeaderAndTab(data);
        renderTopicRail(data);

        var root = document.getElementById('agil-view-root');
        if (!root) return;

        if (state.activeTopic === 'backlog') root.innerHTML = renderBacklog(data);
        else if (state.activeTopic === 'ativa') root.innerHTML = renderSprintActive(data);
        else if (state.activeTopic === 'planejamento') root.innerHTML = renderSprintPlanning(data);
        else if (state.activeTopic === 'ritmo') root.innerHTML = renderBurndown(data);
        else if (state.activeTopic === 'fluxo') root.innerHTML = renderFlowMetrics(data);
        else root.innerHTML = renderBlocks(data);
      }

      function openModal(id) {
        var el = document.getElementById(id);
        if (el) el.classList.add('is-open');
      }

      function closeModal(id) {
        var el = document.getElementById(id);
        if (el) el.classList.remove('is-open');
      }

      function openCloseSprintModal() {
        var data = getCurrentData();
        var sp = data.sprint14;
        var delivered = sp.tasks.filter(function (t) { return t.status === 'Concluído'; });
        var pending = sp.tasks.filter(function (t) { return t.status !== 'Concluído'; });

        pending.forEach(function (t) {
          if (!pendingDecisions[t.id]) pendingDecisions[t.id] = 'Sprint 15';
        });

        var pendingHtml = pending.map(function (t) {
          var chosen = pendingDecisions[t.id] || 'Sprint 15';
          return (
            '<div class="pending-item-row">' +
              '<div style="min-width:0;flex:1 1 220px;">' +
                '<div style="display:flex;align-items:center;gap:6px;">' +
                  '<span class="task-code-mono">' + esc(t.id) + '</span>' +
                  '<strong style="font-size:13px;font-weight:500;">' + esc(t.title) + '</strong>' +
                '</div>' +
                '<span style="font-size:12px;color:var(--color-text-subtle);">Estado atual: ' + esc(t.status) + ' · ' + esc(t.owner) + '</span>' +
              '</div>' +
              '<select class="select" data-pending-dest="' + esc(t.id) + '" aria-label="Destino de ' + esc(t.id) + '">' +
                '<option value="Backlog"' + (chosen === 'Backlog' ? ' selected' : '') + '>Mover para Backlog</option>' +
                '<option value="Sprint 15"' + (chosen === 'Sprint 15' ? ' selected' : '') + '>Passar para Sprint 15</option>' +
                '<option value="Quadro"' + (chosen === 'Quadro' ? ' selected' : '') + '>Manter no Quadro</option>' +
              '</select>' +
            '</div>'
          );
        }).join('');

        var body = document.getElementById('close-sprint-body');
        body.innerHTML =
          '<div class="kv-list" style="border-bottom:1px solid var(--color-divider);padding-bottom:6px;">' +
            '<div class="kv-row"><span class="kv-label">Entregues</span><div class="kv-value"><strong>' + (delivered.length + 4) + ' tarefas</strong></div></div>' +
            '<div class="kv-row"><span class="kv-label">Pendentes</span><div class="kv-value"><strong>' + pending.length + ' tarefas</strong></div></div>' +
          '</div>' +
          '<div style="display:flex;flex-direction:column;gap:6px;">' +
            '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">' +
              '<strong style="font-size:13px;">Destino das tarefas pendentes</strong>' +
              '<div class="batch-bar">' +
                '<button type="button" class="btn btn-sm btn-ghost" data-batch-dest="Backlog">Todas → Backlog</button>' +
                '<button type="button" class="btn btn-sm btn-ghost" data-batch-dest="Sprint 15">Todas → Sprint 15</button>' +
                '<button type="button" class="btn btn-sm btn-ghost" data-batch-dest="Quadro">Todas → Quadro</button>' +
              '</div>' +
            '</div>' +
            '<div>' + pendingHtml + '</div>' +
          '</div>' +
          '<div style="border-top:1px solid var(--color-divider);padding-top:12px;display:flex;flex-direction:column;gap:10px;">' +
            '<strong style="font-size:13px;">Lições aprendidas (Retrospectiva integrada)</strong>' +
            '<div class="field">' +
              '<label class="field-label" for="retro-notes">O que funcionou bem ou pode melhorar?</label>' +
              '<textarea class="textarea" id="retro-notes" placeholder="Ex.: Revisar mais cedo para não acumular na coluna Revisar.">' + esc(state.retroNote) + '</textarea>' +
            '</div>' +
            '<div class="field">' +
              '<label class="field-label" for="retro-action-input">Combinado prático para virar tarefa (opcional)</label>' +
              '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
                '<input type="text" class="input" id="retro-action-input" style="flex:1;min-width:200px;" placeholder="Ex.: Automatizar checklist de homologação" value="' + esc(state.retroActionTitle) + '">' +
                '<button type="button" class="btn btn-secondary" id="btn-retro-to-task">Virar tarefa</button>' +
              '</div>' +
            '</div>' +
          '</div>';

        openModal('modal-close-sprint');
      }

      // Cliques nos tópicos laterais
      document.getElementById('agil-topic-rail').addEventListener('click', function (ev) {
        var btn = ev.target.closest('[data-topic]');
        if (!btn) return;
        state.activeTopic = btn.getAttribute('data-topic');
        render();
      });

      // Ações contextuais no cabeçalho único (.ab-page-head-actions)
      document.getElementById('agil-page-actions').addEventListener('click', function (ev) {
        if (ev.target.closest('#btn-open-new-backlog') || ev.target.closest('#btn-enable-first-idea')) {
          openModal('modal-new-backlog');
          setTimeout(function () { document.getElementById('nb-title').focus(); }, 20);
          return;
        }
        if (ev.target.closest('#btn-open-close-sprint')) {
          openCloseSprintModal();
          return;
        }
        if (ev.target.closest('#btn-start-sprint15')) {
          state.sprint15Started = true;
          proto.showToast('Sprint 15 iniciada! Cartões disponíveis no Quadro.', 'success');
          render();
          return;
        }
        if (ev.target.closest('#btn-open-new-block')) {
          var data = getCurrentData();
          var sel = document.getElementById('blk-task');
          var tasks = data.sprint14.tasks.length ? data.sprint14.tasks : [{ id: 'AB-99', title: 'Tarefa geral do projeto' }];
          sel.innerHTML = tasks.map(function (t) {
            return '<option value="' + esc(t.id + '||' + t.title) + '">' + esc(t.id + ' · ' + t.title) + '</option>';
          }).join('');
          openModal('modal-new-block');
          setTimeout(function () { document.getElementById('blk-reason').focus(); }, 20);
        }
      });

      // Delegação principal de cliques no #agil-view-root
      document.getElementById('agil-view-root').addEventListener('click', function (ev) {
        var data = getCurrentData();

        var moveBtn = ev.target.closest('[data-move]');
        if (moveBtn) {
          var idx = parseInt(moveBtn.getAttribute('data-idx'), 10);
          var dir = moveBtn.getAttribute('data-move');
          var target = dir === 'up' ? idx - 1 : idx + 1;
          if (target >= 0 && target < data.backlog.length) {
            var tmp = data.backlog[idx];
            data.backlog[idx] = data.backlog[target];
            data.backlog[target] = tmp;
            render();
            proto.showToast('Prioridade atualizada no Backlog.', 'info');
          }
          return;
        }

        var sendBtn = ev.target.closest('[data-send-board]');
        if (sendBtn) {
          var id = sendBtn.getAttribute('data-send-board');
          var found = null;
          data.backlog = data.backlog.filter(function (b) {
            if (b.id === id) { found = b; return false; }
            return true;
          });
          if (found) {
            state.lastBoardBanner = found.id + ' ("' + found.title + '") foi enviada para a coluna A fazer no Quadro.';
            proto.showToast(found.id + ' enviada ao Quadro (A fazer)!', 'success');
            render();
          }
          return;
        }

        var allocBtn = ev.target.closest('[data-alloc-sprint]');
        if (allocBtn) {
          var aid = allocBtn.getAttribute('data-alloc-sprint');
          data.backlog.forEach(function (b) {
            if (b.id === aid && !b.allocated) {
              b.allocated = true;
              data.sprint14.tasks.push({
                id: b.id,
                title: b.title,
                status: 'A fazer',
                owner: b.owner,
                hours: parseInt(b.estimate, 10) || 4
              });
              proto.showToast(b.id + ' alocada na Sprint 14.', 'success');
            }
          });
          render();
          return;
        }

        if (ev.target.closest('#btn-open-new-backlog') || ev.target.closest('#btn-enable-first-idea')) {
          openModal('modal-new-backlog');
          setTimeout(function () { document.getElementById('nb-title').focus(); }, 20);
          return;
        }

        if (ev.target.closest('#btn-open-close-sprint')) {
          openCloseSprintModal();
          return;
        }

        if (ev.target.closest('#btn-start-sprint15')) {
          state.sprint15Started = true;
          proto.showToast('Sprint 15 iniciada! Cartões disponíveis no Quadro.', 'success');
          render();
          return;
        }

        if (ev.target.closest('#btn-pull-from-backlog')) {
          if (data.backlog.length) {
            var next = data.backlog.shift();
            data.sprint15.tasks.push({ id: next.id, title: next.title, estimate: (parseInt(next.estimate, 10) || 4) + 'h', owner: next.owner });
            proto.showToast(next.id + ' adicionada na Sprint 15.', 'success');
            render();
          } else {
            proto.showToast('Não há mais itens no Backlog.', 'warning');
          }
          return;
        }

        var filterBtn = ev.target.closest('[data-block-filter]');
        if (filterBtn) {
          state.blockFilter = filterBtn.getAttribute('data-block-filter');
          render();
          return;
        }

        var resolveBtn = ev.target.closest('[data-resolve-block]');
        if (resolveBtn) {
          var bid = resolveBtn.getAttribute('data-resolve-block');
          data.blocks.forEach(function (b) {
            if (b.id === bid) {
              b.resolved = true;
              b.age = 'resolvido agora';
            }
          });
          proto.showToast('Bloqueio marcado como resolvido.', 'success');
          render();
          return;
        }

        if (ev.target.closest('#btn-open-new-block')) {
          var sel = document.getElementById('blk-task');
          var tasks = data.sprint14.tasks.length ? data.sprint14.tasks : [{ id: 'AB-99', title: 'Tarefa geral do projeto' }];
          sel.innerHTML = tasks.map(function (t) {
            return '<option value="' + esc(t.id + '||' + t.title) + '">' + esc(t.id + ' · ' + t.title) + '</option>';
          }).join('');
          openModal('modal-new-block');
          setTimeout(function () { document.getElementById('blk-reason').focus(); }, 20);
        }
      });

      // Mover cartão dentro da Sprint Ativa por arrastar e soltar (igual ao Quadro)
      var draggingSprintTaskId = null;
      var agilViewRoot = document.getElementById('agil-view-root');

      function clearSprintDropTargets() {
        var cols = agilViewRoot.querySelectorAll('.sprint-col.is-drop-target');
        for (var i = 0; i < cols.length; i++) {
          cols[i].classList.remove('is-drop-target');
        }
      }

      function moveSprintTask(taskId, newStatus) {
        if (!taskId || !newStatus) return;
        var data = getCurrentData();
        var movedTask = null;
        for (var i = 0; i < data.sprint14.tasks.length; i++) {
          if (data.sprint14.tasks[i].id === taskId) {
            movedTask = data.sprint14.tasks[i];
            break;
          }
        }
        if (!movedTask || movedTask.status === newStatus) return;
        movedTask.status = newStatus;
        var isManager = proto.getRole() === 'manager';
        if (isManager) movedTask.editedByManager = true;
        if (newStatus === 'Desenvolvendo') {
          proto.completeKanStep('c2');
        }
        if (window.AgileBoxKanAI) {
          var aiStore = window.AgileBoxKanAI.getStore();
          var sprintStore = aiStore && aiStore.sprints && aiStore.sprints[state.projectId];
          if (sprintStore && Array.isArray(sprintStore.tasks)) {
            for (var j = 0; j < sprintStore.tasks.length; j++) {
              if (sprintStore.tasks[j].id === taskId) {
                sprintStore.tasks[j].status = newStatus;
                if (isManager) sprintStore.tasks[j].editedByManager = true;
                break;
              }
            }
            window.AgileBoxKanAI.saveStore(aiStore);
          }
        }
        proto.showToast(taskId + ' movida para ' + newStatus + (isManager ? ' (marca Gestor).' : '.'), 'success');
        render();
      }

      agilViewRoot.addEventListener('dragstart', function (ev) {
        var card = ev.target.closest('.sprint-task-card[data-sprint-task]');
        if (!card) return;
        if (state.sprint14Closed) {
          ev.preventDefault();
          return;
        }
        draggingSprintTaskId = card.getAttribute('data-sprint-task');
        if (ev.dataTransfer) {
          ev.dataTransfer.setData('text/plain', draggingSprintTaskId);
          ev.dataTransfer.effectAllowed = 'move';
        }
        card.classList.add('is-dragging');
      });

      agilViewRoot.addEventListener('dragend', function () {
        draggingSprintTaskId = null;
        clearSprintDropTargets();
        var dragging = agilViewRoot.querySelectorAll('.sprint-task-card.is-dragging');
        for (var i = 0; i < dragging.length; i++) {
          dragging[i].classList.remove('is-dragging');
        }
      });

      agilViewRoot.addEventListener('dragover', function (ev) {
        var col = ev.target.closest('.sprint-col[data-sprint-col-status]');
        if (!col || !draggingSprintTaskId || state.sprint14Closed) return;
        ev.preventDefault();
        if (ev.dataTransfer) ev.dataTransfer.dropEffect = 'move';
        if (!col.classList.contains('is-drop-target')) {
          clearSprintDropTargets();
          col.classList.add('is-drop-target');
        }
      });

      agilViewRoot.addEventListener('dragleave', function (ev) {
        var col = ev.target.closest('.sprint-col[data-sprint-col-status]');
        if (!col) return;
        if (!ev.relatedTarget || !col.contains(ev.relatedTarget)) {
          col.classList.remove('is-drop-target');
        }
      });

      agilViewRoot.addEventListener('drop', function (ev) {
        var col = ev.target.closest('.sprint-col[data-sprint-col-status]');
        if (!col) return;
        ev.preventDefault();
        clearSprintDropTargets();
        if (state.sprint14Closed) {
          draggingSprintTaskId = null;
          return;
        }
        var tid = draggingSprintTaskId || (ev.dataTransfer ? ev.dataTransfer.getData('text/plain') : '');
        var targetStatus = col.getAttribute('data-sprint-col-status');
        draggingSprintTaskId = null;
        moveSprintTask(tid, targetStatus);
      });

      // Fechar modais (clique e Escape)
      document.addEventListener('click', function (ev) {
        var closeBtn = ev.target.closest('[data-close-modal]');
        if (closeBtn) {
          closeModal(closeBtn.getAttribute('data-close-modal'));
          return;
        }
        if (ev.target.classList && ev.target.classList.contains('modal-backdrop') && ev.target.id !== 'ab-global-newtask-modal') {
          ev.target.classList.remove('is-open');
        }
      });

      document.addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape') {
          ['modal-new-backlog', 'modal-new-block', 'modal-close-sprint'].forEach(closeModal);
        }
      });

      // Submit nova tarefa futura
      document.getElementById('form-new-backlog').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var title = document.getElementById('nb-title').value.trim();
        if (!title) return;
        var data = getCurrentData();
        var nextNum = 18 + data.backlog.length;
        var prefix = state.projectId === 'b' ? 'ERP-' : (state.projectId === 'c' ? 'SIM-' : 'AB-');
        data.backlog.push({
          id: prefix + nextNum,
          title: title,
          priority: document.getElementById('nb-priority').value,
          estimate: document.getElementById('nb-est').value,
          owner: document.getElementById('nb-owner').value,
          allocated: false
        });
        document.getElementById('nb-title').value = '';
        closeModal('modal-new-backlog');
        proto.showToast('Tarefa adicionada ao Backlog.', 'success');
        render();
      });

      // Submit novo bloqueio
      document.getElementById('form-new-block').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var rawTask = document.getElementById('blk-task').value.split('||');
        var reason = document.getElementById('blk-reason').value.trim();
        if (!reason) return;
        var data = getCurrentData();
        data.blocks.unshift({
          id: 'BLK-' + (data.blocks.length + 10),
          taskId: rawTask[0] || 'AB-01',
          taskTitle: rawTask[1] || 'Tarefa do projeto',
          reason: reason,
          owner: document.getElementById('blk-owner').value,
          age: 'registrado agora',
          resolved: false
        });
        document.getElementById('blk-reason').value = '';
        closeModal('modal-new-block');
        proto.showToast('Bloqueio registrado e visível no Dashboard.', 'warning');
        render();
      });

      // Interações dentro do modal Encerrar Sprint
      document.getElementById('modal-close-sprint').addEventListener('click', function (ev) {
        var batchBtn = ev.target.closest('[data-batch-dest]');
        if (batchBtn) {
          var dest = batchBtn.getAttribute('data-batch-dest');
          var selects = document.querySelectorAll('[data-pending-dest]');
          for (var i = 0; i < selects.length; i++) {
            selects[i].value = dest;
            pendingDecisions[selects[i].getAttribute('data-pending-dest')] = dest;
          }
          proto.showToast('Todos os itens pendentes marcados para: ' + dest, 'info');
          return;
        }
        if (ev.target.closest('#btn-retro-to-task')) {
          var noteEl = document.getElementById('retro-notes');
          var actEl = document.getElementById('retro-action-input');
          state.retroNote = noteEl ? noteEl.value.trim() : '';
          var actTitle = actEl ? actEl.value.trim() : '';
          if (!actTitle) {
            actTitle = 'Melhoria da Retro: revisar entregas antes do fim da sprint';
          }
          var data = getCurrentData();
          var newId = 'RET-' + (data.backlog.length + 1);
          data.backlog.unshift({
            id: newId,
            title: actTitle,
            priority: 'Alta',
            estimate: '2h · Rápida',
            owner: 'Pedro',
            allocated: false
          });
          state.retroActionTitle = '';
          if (actEl) actEl.value = '';
          proto.showToast('Aprendizado registrado e tarefa ' + newId + ' criada no Backlog!', 'success');
        }
      });

      document.getElementById('modal-close-sprint').addEventListener('change', function (ev) {
        var sel = ev.target.closest('[data-pending-dest]');
        if (sel) {
          pendingDecisions[sel.getAttribute('data-pending-dest')] = sel.value;
        }
      });

      document.getElementById('btn-confirm-close-sprint').addEventListener('click', function () {
        var data = getCurrentData();
        var remaining = [];
        data.sprint14.tasks.forEach(function (t) {
          if (t.status === 'Concluído') {
            remaining.push(t);
            return;
          }
          var dest = pendingDecisions[t.id] || 'Sprint 15';
          if (dest === 'Backlog') {
            data.backlog.push({ id: t.id, title: t.title, priority: 'Média', estimate: t.hours + 'h · Média', owner: t.owner, allocated: false });
          } else if (dest === 'Sprint 15') {
            data.sprint15.tasks.push({ id: t.id, title: t.title, estimate: t.hours + 'h', owner: t.owner });
          }
        });
        data.sprint14.tasks = remaining;
        state.sprint14Closed = true;
        closeModal('modal-close-sprint');
        proto.showToast('Sprint 14 encerrada e pendentes redistribuídas com segurança.', 'success');
        render();
      });

      function syncFromAIStore(skipRender) {
        if (!window.AgileBoxKanAI) return;
        var st = window.AgileBoxKanAI.getStore();
        if (!st) return;
        ['a', 'b', 'c'].forEach(function (pid) {
          var pData = state.projectsData[pid];
          if (!pData) return;
          if (st.backlog && Array.isArray(st.backlog[pid])) {
            pData.backlog = JSON.parse(JSON.stringify(st.backlog[pid]));
          }
          if (st.sprints && st.sprints[pid] && pData.sprint14) {
            pData.sprint14.name = st.sprints[pid].name;
            pData.sprint14.goal = st.sprints[pid].goal;
            pData.sprint14.tasks = JSON.parse(JSON.stringify(st.sprints[pid].tasks || []));
            if (pid === state.projectId) {
              state.sprint14Closed = Boolean(st.sprints[pid].closed);
            }
          }
        });
        if (!skipRender) render();
      }

      window.addEventListener('ab:projectchange', function (e) {
        state.projectId = e.detail.projectId;
        state.lastBoardBanner = '';
        syncFromAIStore(true);
        render();
      });

      window.addEventListener('ab:storechange', function () {
        syncFromAIStore(false);
      });

      window.addEventListener('ab:taskcreated', function (e) {
        if (e.detail && e.detail.source === 'kan-ai') return;
        if (e.detail && e.detail.projectId === state.projectId) {
          var data = getCurrentData();
          data.backlog.unshift({
            id: 'NV-' + (data.backlog.length + 20),
            title: e.detail.title,
            priority: 'Média',
            estimate: '2h · Rápida',
            owner: e.detail.assignee || 'Pedro',
            allocated: false
          });
          if (state.activeTopic === 'backlog') render();
        }
      });

      syncFromAIStore(true);
      render();
    });
  </script>
</body>
</html>
