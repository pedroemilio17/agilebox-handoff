<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>AgileBox — Bandeja</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.stage{position:relative;overflow:hidden;box-sizing:border-box;background:#0A0C11;color:#F5F5F7;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Inter',system-ui,sans-serif;font-size:15px;line-height:1.3;-webkit-font-smoothing:antialiased}
.stage button,.stage input{font:inherit;color:inherit}
.stage button{cursor:pointer}
.stage button:focus-visible,.stage a:focus-visible,.stage input:focus-visible{outline:2px solid #64A8FF;outline-offset:2px}

/* fundo de área de trabalho, só para o vidro ter o que desfocar */
.wall{position:absolute;inset:0}
.blob{position:absolute;border-radius:50%;filter:blur(70px)}
.b1{left:-70px;top:30px;width:320px;height:320px;background:#2457E6;opacity:.6}
.b2{right:-50px;bottom:90px;width:280px;height:280px;background:#8A44E8;opacity:.5}
.win{position:absolute;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);padding:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
.w1{left:20px;top:36px;width:250px;height:150px}
.w2{left:56px;top:290px;width:300px;height:230px}
.ln{height:8px;border-radius:4px;background:rgba(255,255,255,.2)}

/* bandeja em vidro */
.tray{position:absolute;right:24px;bottom:24px;display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden;border-radius:22px;
  background:linear-gradient(150deg,rgba(255,255,255,.12),rgba(255,255,255,0) 45%),rgba(30,33,42,.5);
  backdrop-filter:blur(32px) saturate(170%);-webkit-backdrop-filter:blur(32px) saturate(170%);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 28px 64px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);
  transition:height .45s cubic-bezier(.32,.72,0,1),width .45s cubic-bezier(.32,.72,0,1);
  animation:trayIn .6s cubic-bezier(.32,.72,0,1) both}
.tray.dragging{transition:none}
.grip{position:absolute;top:0;left:50%;margin-left:-60px;width:120px;height:16px;z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:6px 0 0;background:none;border:0;cursor:ns-resize;touch-action:none}
.pill{display:block;width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);transition:background .2s,width .2s}
.grip:hover .pill,.tray.dragging .pill{background:rgba(255,255,255,.55);width:44px}

.scr{position:relative;display:flex;flex-direction:column;flex:1;min-height:0}
.in-fwd{animation:inFwd .45s cubic-bezier(.32,.72,0,1) both}
.in-back{animation:inBack .45s cubic-bezier(.32,.72,0,1) both}
.in-fade{animation:inFade .5s ease both}

.hd{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 8px 0 20px;flex:none;box-sizing:border-box}
.hd.sub{display:grid;grid-template-columns:auto 1fr auto;padding:0 8px}
.hd.sub .ttl{text-align:center}
.ttl{font-size:17px;font-weight:600;letter-spacing:-.2px}
.lnk{display:inline-flex;align-items:center;height:44px;padding:0 4px;color:#64A8FF;text-decoration:none;font-size:15px;border-radius:10px}
.lnk:hover{color:#8DBFFF}
.wc{display:flex;align-items:center}
.wb{display:inline-flex;align-items:center;justify-content:center;width:40px;height:44px;border:0;border-radius:10px;background:none;color:#D1D1D6;text-decoration:none;transition:background .2s,color .2s}
.wb:hover{background:rgba(255,255,255,.12);color:#fff}
.wb.close:hover{background:rgba(255,69,58,.9)}
.back{justify-self:start;display:inline-flex;align-items:center;gap:2px;height:44px;padding:0 8px 0 2px;background:none;border:0;border-radius:10px;color:#64A8FF;font-size:17px}

.mid{flex:1;min-height:0;overflow-y:auto;padding-top:2px}
.mid::-webkit-scrollbar,.list::-webkit-scrollbar,.body::-webkit-scrollbar,.dta::-webkit-scrollbar{width:3px}
.mid::-webkit-scrollbar-track,.list::-webkit-scrollbar-track,.body::-webkit-scrollbar-track,.dta::-webkit-scrollbar-track{background:transparent}
.mid::-webkit-scrollbar-thumb,.list::-webkit-scrollbar-thumb,.body::-webkit-scrollbar-thumb,.dta::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:2px}
@supports (-moz-appearance:none){.mid,.list,.body,.dta{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) transparent}}

.search{position:relative;margin:0 16px 8px}
.sicon{position:absolute;left:12px;top:14px;color:#9A9AA0;pointer-events:none}
.sinput{width:100%;box-sizing:border-box;height:44px;border-radius:12px;border:0;background:rgba(118,118,128,.24);padding:0 12px 0 36px;font-size:15px}
.sinput::placeholder,.fi::placeholder{color:#9A9AA0}

.segc{position:relative;display:flex;height:44px;box-sizing:border-box;padding:3px;margin:0 16px 8px;border-radius:12px;background:rgba(118,118,128,.24)}
.thumb{position:absolute;left:3px;top:3px;height:38px;border-radius:9px;background:rgba(255,255,255,.2);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .38s cubic-bezier(.32,.72,0,1)}
.n2{width:calc(50% - 3px)}
.n3{width:calc(33.333% - 2px)}
.p1{transform:translateX(100%)}
.p2{transform:translateX(200%)}
.sb{position:relative;z-index:1;flex:1;height:38px;border:0;border-radius:9px;background:none;color:#AEAEB2;font-size:15px;font-weight:500;transition:color .25s}
.sb.on{color:#F5F5F7;font-weight:600}

.list{margin:0 16px 8px;overflow-y:auto;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);box-sizing:content-box;transition:height .45s cubic-bezier(.32,.72,0,1)}
.row{display:flex;flex-direction:column;justify-content:center;gap:6px;width:100%;height:64px;box-sizing:border-box;text-align:left;background:none;border:0;padding:0 14px;transition:background .2s}
.row+.row{border-top:1px solid rgba(255,255,255,.08)}
.row:hover{background:rgba(255,255,255,.06)}
.row:active{background:rgba(255,255,255,.12)}
.row.fresh{animation:rowIn .6s cubic-bezier(.32,.72,0,1) both}
.rt{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm{display:flex;flex-wrap:nowrap;gap:8px;align-items:center;color:#AEAEB2;font-size:12px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;font-size:11px;font-weight:500;border:1px solid currentColor}
.s-planejamento{color:#BF5AF2}
.s-afazer{color:#C7C7CC}
.s-desenvolvendo{color:#64A8FF}
.s-revisar{color:#FF9F0A}
.s-concluido{color:#32D74B}
.empty{display:flex;align-items:center;justify-content:center;height:64px;margin:0;color:#AEAEB2}

.ft{flex:none;padding:16px;box-sizing:border-box}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.22);background:rgba(11,102,228,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-size:17px;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.28);transition:transform .18s cubic-bezier(.32,.72,0,1),background .2s}
.btn:hover{background:rgba(30,118,238,.94)}
.btn:active{transform:scale(.97)}
.btn:disabled{background:rgba(118,118,128,.3);color:#9A9AA0;box-shadow:none;cursor:not-allowed;transform:none}

.toast{position:absolute;left:16px;right:16px;bottom:88px;z-index:15;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(58,62,74,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);animation:toastIn .5s cubic-bezier(.32,.72,0,1) both}
.tick{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .5s .2s ease forwards}

.body{flex:1;min-height:0;overflow-y:auto;padding:2px 0 8px}
.tb{height:60px;box-sizing:border-box;padding:2px 20px 0;display:flex;flex-direction:column;justify-content:center;gap:4px}
.tt{font-size:20px;font-weight:600;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-size:13px;color:#AEAEB2}
.grp{position:relative;margin:0 16px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08)}
.grp>*+*{border-top:1px solid rgba(255,255,255,.08)}
.fr{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;height:48px;box-sizing:border-box;padding:0 14px;background:none;border:0;transition:background .2s}
.fr.last{border-radius:0 0 14px 14px}
.fr:focus-within{background:rgba(255,255,255,.08)}
.stwrap{position:relative}
.stbtn{border-radius:14px 14px 0 0;text-align:left}
.stbtn:hover{background:rgba(255,255,255,.06)}
.fl{flex:none;font-size:15px;color:#AEAEB2}
.fi{flex:1;min-width:0;height:44px;text-align:right;background:none;border:0;outline:none;font-size:15px;color-scheme:dark}
.fi.left{text-align:left;font-size:17px}
.fi::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.6}
.sv{display:inline-flex;align-items:center;gap:8px;font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;background:currentColor}
.chev{transition:transform .3s cubic-bezier(.32,.72,0,1);color:#AEAEB2}
.chev.open{transform:rotate(180deg)}
.pop{position:absolute;right:8px;top:calc(100% - 2px);width:224px;z-index:10;box-sizing:border-box;padding:6px;border-radius:16px;background:rgba(48,52,64,.9);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid rgba(255,255,255,.16);box-shadow:0 18px 44px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.18);transform-origin:top right;animation:popIn .28s cubic-bezier(.32,.72,0,1) both}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;height:44px;padding:0 10px;border:0;border-radius:10px;background:none;text-align:left}
.opt:hover{background:rgba(255,255,255,.1)}
.gh{margin:16px 20px 8px;font-size:12px;font-weight:500;letter-spacing:.3px;text-transform:uppercase;color:#AEAEB2}
.newseg{margin:0 16px 8px}
.hint{margin:0 20px;font-size:12px;color:#AEAEB2}

.dgrp{margin-bottom:12px}
.dgrp:focus-within{background:rgba(255,255,255,.1)}
.dta{display:block;width:100%;box-sizing:border-box;height:72px;padding:12px 14px;background:none;border:0;border-radius:14px;outline:none;resize:none;font-size:15px;line-height:1.35;color:#F5F5F7}
.dta::placeholder{color:#9A9AA0}
.tray.out{animation:trayOut .32s cubic-bezier(.32,.72,0,1) both}
.tray.min .scr>:not(.hd){visibility:hidden}
.tray.min .grip{display:none}
.tbicon{position:absolute;right:24px;bottom:24px;display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(30,33,42,.55);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);color:#F5F5F7;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 10px 30px rgba(0,0,0,.4);animation:iconIn .45s cubic-bezier(.32,.72,0,1) both;transition:transform .18s}
.tbicon:hover{background:rgba(52,56,68,.7)}
.tbicon:active{transform:scale(.94)}
@keyframes trayOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(16px) scale(.96);filter:blur(6px)}}
@keyframes iconIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes trayIn{from{opacity:0;transform:translateY(18px) scale(.96);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes inFwd{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes inFade{from{opacity:0}to{opacity:1}}
@keyframes rowIn{from{opacity:0;transform:translateY(-14px);background:rgba(10,132,255,.4)}to{opacity:1;transform:none;background:rgba(10,132,255,0)}}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.92) translateY(-6px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.stage *{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</helmet>
<div class="stage" style="width: 440px; height: 640px">

  <div class="wall" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="win w1">
      <div class="ln" style="width: 70%"></div>
      <div class="ln" style="width: 90%"></div>
      <div class="ln" style="width: 55%"></div>
    </div>
    <div class="win w2">
      <div class="ln" style="width: 40%"></div>
      <div class="ln" style="width: 85%"></div>
      <div class="ln" style="width: 75%"></div>
      <div class="ln" style="width: 92%"></div>
      <div class="ln" style="width: 60%"></div>
      <div class="ln" style="width: 80%"></div>
    </div>
  </div>

  <sc-if value="{{ trayOn }}" hint-placeholder-val="{{ true }}">
  <section class="tray {{ trayCls }}" aria-label="Bandeja AgileBox" style="width: {{ trayW }}px; height: {{ trayH }}px">

    <button class="grip" aria-label="Redimensionar a bandeja. Arraste, use as setas ou dê duplo clique para voltar ao tamanho automático" onPointerDown="{{ gripDown }}" onPointerMove="{{ gripMove }}" onPointerUp="{{ gripUp }}" onPointerCancel="{{ gripUp }}" onDoubleClick="{{ gripReset }}" onKeyDown="{{ gripKey }}">
      <span class="pill"></span>
    </button>

    <sc-if value="{{ homeOn }}" hint-placeholder-val="{{ true }}">
      <div class="scr {{ animCls }}">
        <div class="hd">
          <span class="ttl">AgileBox</span>
          <div class="wc" role="group" aria-label="Controles da janela">
            <button class="wb" aria-label="{{ minLabel }}" onClick="{{ toggleMin }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14"></path></svg>
            </button>
            <a class="wb" href="Painel.dc.html" aria-label="Expandir para o painel principal">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3.5"></rect></svg>
            </a>
            <button class="wb close" aria-label="Fechar a bandeja" onClick="{{ closeTray }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
            </button>
          </div>
        </div>
        <div class="mid">
          <div class="search">
            <svg class="sicon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
            <input class="sinput" type="search" aria-label="Buscar tarefas" placeholder="Buscar" value="{{ query }}" onInput="{{ setQuery }}">
          </div>
          <div class="segc" role="group" aria-label="Lista de tarefas">
            <span class="thumb n2 {{ tabThumb }}"></span>
            <button class="sb {{ tabRCls }}" aria-pressed="{{ tabROn }}" onClick="{{ showRecentes }}">Recentes</button>
            <button class="sb {{ tabFCls }}" aria-pressed="{{ tabFOn }}" onClick="{{ showFrequentes }}">Frequentes</button>
          </div>
          <div class="list" style="height: {{ listH }}px">
            <sc-for list="{{ visible }}" as="item" hint-placeholder-count="2">
              <button class="row {{ item.freshCls }}" onClick="{{ item.open }}">
                <span class="rt">{{ item.title }}</span>
                <span class="rm">
                  <span class="chip {{ item.statusCls }}">{{ item.statusLabel }}</span>
                  <span>{{ item.project }}</span>
                  <span>{{ item.updated }}</span>
                </span>
              </button>
            </sc-for>
            <sc-if value="{{ emptyOn }}" hint-placeholder-val="{{ false }}">
              <p class="empty">{{ emptyText }}</p>
            </sc-if>
          </div>
        </div>
        <sc-if value="{{ toastOn }}" hint-placeholder-val="{{ false }}">
          <div class="toast" role="status">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#32D74B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="tick" d="M5 12l5 5 9-10"></path></svg>
            <span>{{ toast }}</span>
          </div>
        </sc-if>
        <div class="ft">
          <button class="btn" onClick="{{ goNew }}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            <span>Nova tarefa</span>
          </button>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ taskOn }}" hint-placeholder-val="{{ false }}">
      <div class="scr {{ animCls }}">
        <div class="hd sub">
          <button class="back" aria-label="Voltar para as tarefas" onClick="{{ goHome }}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
            <span>Tarefas</span>
          </button>
          <span class="ttl">{{ taskTitle }}</span>
          <div class="wc" role="group" aria-label="Controles da janela">
            <button class="wb" aria-label="{{ minLabel }}" onClick="{{ toggleMin }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14"></path></svg>
            </button>
            <a class="wb" href="Painel.dc.html" aria-label="Expandir para o painel principal">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3.5"></rect></svg>
            </a>
            <button class="wb close" aria-label="Fechar a bandeja" onClick="{{ closeTray }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
            </button>
          </div>
        </div>
        <div class="body">
          <div class="tb">
            <div class="tt">{{ sel.title }}</div>
            <div class="tm">{{ sel.project }}</div>
          </div>
          <div class="grp dgrp">
            <textarea class="dta" aria-label="Descrição: o que será feito" placeholder="O que será feito? Adicione detalhes" value="{{ draftDesc }}" onInput="{{ setDesc }}"></textarea>
          </div>
          <div class="grp">
            <div class="stwrap">
              <button class="fr stbtn" aria-haspopup="menu" aria-expanded="{{ statusOpen }}" onClick="{{ toggleStatus }}">
                <span class="fl">Status</span>
                <span class="sv {{ draftStatusCls }}">
                  <span class="dot"></span>
                  <span>{{ draftStatusLabel }}</span>
                  <svg class="chev {{ chevCls }}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
                </span>
              </button>
              <sc-if value="{{ statusOpen }}" hint-placeholder-val="{{ false }}">
                <div class="pop" role="menu" aria-label="Status da tarefa">
                  <sc-for list="{{ statusOptions }}" as="opt" hint-placeholder-count="4">
                    <button class="opt" role="menuitemradio" aria-checked="{{ opt.pressed }}" onClick="{{ opt.pick }}">
                      <span class="sv {{ opt.cls }}"><span class="dot"></span><span>{{ opt.label }}</span></span>
                      <sc-if value="{{ opt.pressed }}" hint-placeholder-val="{{ false }}">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64A8FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
                      </sc-if>
                    </button>
                  </sc-for>
                </div>
              </sc-if>
            </div>
            <label class="fr">
              <span class="fl">Prazo</span>
              <input class="fi" type="date" value="{{ draftDeadline }}" onInput="{{ setDeadline }}">
            </label>
            <label class="fr">
              <span class="fl">Responsável</span>
              <input class="fi" type="text" placeholder="Adicionar" value="{{ draftOwner }}" onInput="{{ setOwner }}">
            </label>
            <label class="fr">
              <span class="fl">Envolvidos</span>
              <input class="fi" type="text" placeholder="Adicionar" value="{{ draftInvolved }}" onInput="{{ setInvolved }}">
            </label>
            <label class="fr last">
              <span class="fl">Chamado</span>
              <input class="fi" type="text" placeholder="Nº do chamado" value="{{ draftTicket }}" onInput="{{ setTicket }}">
            </label>
          </div>
        </div>
        <div class="ft">
          <button class="btn" onClick="{{ save }}">Salvar</button>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ newOn }}" hint-placeholder-val="{{ false }}">
      <div class="scr {{ animCls }}">
        <div class="hd sub">
          <button class="back" aria-label="Voltar para as tarefas" onClick="{{ goHome }}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
            <span>Tarefas</span>
          </button>
          <span class="ttl">Nova tarefa</span>
          <div class="wc" role="group" aria-label="Controles da janela">
            <button class="wb" aria-label="{{ minLabel }}" onClick="{{ toggleMin }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14"></path></svg>
            </button>
            <a class="wb" href="Painel.dc.html" aria-label="Expandir para o painel principal">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3.5"></rect></svg>
            </a>
            <button class="wb close" aria-label="Fechar a bandeja" onClick="{{ closeTray }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
            </button>
          </div>
        </div>
        <div class="body">
          <div class="grp">
            <label class="fr last" style="border-radius: 14px">
              <input class="fi left" type="text" aria-label="Título da tarefa" placeholder="Título da tarefa" value="{{ draftTitle }}" onInput="{{ setTitle }}">
            </label>
          </div>
          <div class="gh" id="lbl-projeto">Projeto</div>
          <div class="segc newseg" role="group" aria-labelledby="lbl-projeto">
            <span class="thumb n3 {{ projThumb }}"></span>
            <sc-for list="{{ projectOptions }}" as="p" hint-placeholder-count="3">
              <button class="sb {{ p.cls }}" aria-pressed="{{ p.pressed }}" onClick="{{ p.pick }}">{{ p.label }}</button>
            </sc-for>
          </div>
          <p class="hint">Prazo e demais detalhes entram depois.</p>
        </div>
        <div class="ft">
          <button class="btn" disabled="{{ createDisabled }}" onClick="{{ create }}">Criar tarefa</button>
        </div>
      </div>
    </sc-if>

  </section>
  </sc-if>

  <sc-if value="{{ closed }}" hint-placeholder-val="{{ false }}">
    <button class="tbicon" aria-label="Abrir AgileBox" onClick="{{ openTray }}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8l8-4 8 4-8 4-8-4z"></path><path d="M4 8v8l8 4 8-4V8"></path><path d="M12 12v8"></path></svg>
    </button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":640}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      screen: 'home',
      anim: 'in-fade',
      tab: 'recentes',
      query: '',
      selectedId: 0,
      freshId: 0,
      statusOpen: false,
      draftStatus: 'afazer',
      draftDeadline: '',
      draftOwner: '',
      draftInvolved: '',
      draftTicket: '',
      draftTitle: '',
      draftProject: 'Projeto A',
      manual: null,
      dragging: false,
      minimized: false,
      closing: false,
      closed: false,
      justCreated: false,
      draftDesc: '',
      toast: '',
      nextId: 5,
      tasks: [
        { id: 1, title: 'Atualizar documentação da API', project: 'Projeto A', status: 'desenvolvendo', deadline: '2026-11-05', owner: '', involved: '', ticket: '', updated: 'há 12 min', pinned: true },
        { id: 2, title: 'Revisar integração de chamados', project: 'Projeto B', status: 'revisar', deadline: '2026-11-06', owner: '', involved: '', ticket: '', updated: 'há 2 h', pinned: true },
        { id: 3, title: 'Responder pendências do suporte', project: 'Projeto C', status: 'afazer', deadline: '', owner: '', involved: '', ticket: '', updated: 'ontem', pinned: false },
        { id: 4, title: 'Publicar versão de teste', project: 'Projeto A', status: 'concluido', deadline: '2026-11-03', owner: '', involved: '', ticket: '', updated: 'ontem', pinned: false }
      ]
    };
  }

  componentWillUnmount() {
    clearTimeout(this._t);
    clearTimeout(this._c);
  }

  toggleMin() {
    this.setState({ minimized: !this.state.minimized, statusOpen: false });
  }

  closeTray() {
    clearTimeout(this._c);
    this.setState({ closing: true, statusOpen: false });
    this._c = setTimeout(() => this.setState({ closed: true, closing: false, minimized: false }), 320);
  }

  openTray() {
    this.setState({ closed: false });
  }

  goHome() {
    const s = this.state;
    if (s.screen === 'task' && s.justCreated) {
      this.setState({ screen: 'home', anim: 'in-back', freshId: s.selectedId, statusOpen: false, justCreated: false });
      this.flash('Tarefa criada');
    } else {
      this.setState({ screen: 'home', anim: 'in-back', freshId: 0, statusOpen: false });
    }
  }

  flash(text) {
    clearTimeout(this._t);
    this.setState({ toast: text });
    this._t = setTimeout(() => this.setState({ toast: '' }), 2600);
  }

  visibleTasks() {
    const s = this.state;
    const q = s.query.trim().toLowerCase();
    let list = s.tab === 'frequentes' ? s.tasks.filter((t) => t.pinned) : s.tasks;
    if (q) list = list.filter((t) => (t.title + ' ' + t.project).toLowerCase().indexOf(q) !== -1);
    return list;
  }

  autoHeight() {
    const s = this.state;
    if (s.screen === 'task') return 560;
    if (s.screen === 'new') return 316;
    return 246 + Math.max(Math.min(this.visibleTasks().length, 2), 1) * 64;
  }

  dims() {
    const m = this.state.manual;
    return { w: m ? m.w : 360, h: this.state.minimized ? 52 : (m ? m.h : this.autoHeight()) };
  }

  clamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v));
  }

  gripDown(e) {
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
    const d = this.dims();
    this._drag = { x: e.clientX, y: e.clientY, w: d.w, h: d.h };
    this.setState({ dragging: true });
  }

  gripMove(e) {
    const d = this._drag;
    if (!d) return;
    this.setState({ manual: {
      w: this.clamp(d.w + (d.x - e.clientX), 340, 400),
      h: this.clamp(d.h + (d.y - e.clientY), 260, 600)
    } });
  }

  gripUp() {
    this._drag = null;
    this.setState({ dragging: false });
  }

  gripReset() {
    this.setState({ manual: null });
  }

  gripKey(e) {
    const d = this.dims();
    let w = d.w;
    let h = d.h;
    if (e.key === 'ArrowUp') h += 24;
    else if (e.key === 'ArrowDown') h -= 24;
    else if (e.key === 'ArrowLeft') w += 24;
    else if (e.key === 'ArrowRight') w -= 24;
    else if (e.key === 'Home') { this.setState({ manual: null }); return; }
    else return;
    if (e.preventDefault) e.preventDefault();
    this.setState({ manual: { w: this.clamp(w, 340, 400), h: this.clamp(h, 260, 600) } });
  }

  openTask(id) {
    const t = this.state.tasks.find((x) => x.id === id);
    if (!t) return;
    this.setState({
      screen: 'task', anim: 'in-fwd', selectedId: id, freshId: 0, statusOpen: false, toast: '',
      draftStatus: t.status, draftDeadline: t.deadline, draftOwner: t.owner, draftInvolved: t.involved, draftTicket: t.ticket,
      draftDesc: t.desc || '', justCreated: false
    });
  }

  save() {
    const s = this.state;
    const t = s.tasks.find((x) => x.id === s.selectedId);
    if (!t) return;
    const updated = Object.assign({}, t, {
      status: s.draftStatus, deadline: s.draftDeadline, owner: s.draftOwner, involved: s.draftInvolved, ticket: s.draftTicket, desc: s.draftDesc, updated: 'agora'
    });
    const rest = s.tasks.filter((x) => x.id !== t.id);
    this.setState({ tasks: [updated].concat(rest), screen: 'home', anim: 'in-back', freshId: t.id, statusOpen: false, justCreated: false });
    this.flash(s.justCreated ? 'Tarefa criada' : 'Atualização salva');
  }

  create() {
    const s = this.state;
    const title = s.draftTitle.trim();
    if (!title) return;
    const t = { id: s.nextId, title: title, project: s.draftProject, status: 'afazer', deadline: '', owner: '', involved: '', ticket: '', desc: '', updated: 'agora', pinned: false };
    this.setState({
      tasks: [t].concat(s.tasks), nextId: s.nextId + 1, screen: 'task', anim: 'in-fwd', tab: 'recentes', query: '', draftTitle: '',
      selectedId: t.id, freshId: 0, statusOpen: false, justCreated: true, toast: '',
      draftStatus: 'afazer', draftDeadline: '', draftOwner: '', draftInvolved: '', draftTicket: '', draftDesc: ''
    });
  }

  renderVals() {
    const s = this.state;
    const labels = { planejamento: 'Planejamento', afazer: 'A fazer', desenvolvendo: 'Desenvolvendo', revisar: 'Revisar', concluido: 'Concluído' };
    const list = this.visibleTasks();
    const visible = list.map((t) => ({
      title: t.title,
      project: t.project,
      updated: t.updated,
      statusLabel: labels[t.status],
      statusCls: 's-' + t.status,
      freshCls: t.id === s.freshId ? 'fresh' : '',
      open: () => this.openTask(t.id)
    }));
    const found = s.tasks.find((t) => t.id === s.selectedId);
    const sel = found || { title: '', project: '' };
    const d = this.dims();
    const projects = ['Projeto A', 'Projeto B', 'Projeto C'];
    return {
      homeOn: s.screen === 'home',
      taskOn: s.screen === 'task',
      newOn: s.screen === 'new',
      animCls: s.anim,
      trayOn: !s.closed,
      closed: s.closed,
      toggleMin: () => this.toggleMin(),
      minLabel: s.minimized ? 'Restaurar a bandeja' : 'Minimizar a bandeja',
      closeTray: () => this.closeTray(),
      openTray: () => this.openTray(),
      taskTitle: s.justCreated ? 'Nova tarefa' : 'Atualizar',
      draftDesc: s.draftDesc,
      setDesc: (e) => this.setState({ draftDesc: e.target.value }),
      trayW: d.w,
      trayH: d.h,
      trayCls: [s.dragging ? 'dragging' : '', s.minimized ? 'min' : '', s.closing ? 'out' : ''].join(' '),
      gripDown: (e) => this.gripDown(e),
      gripMove: (e) => this.gripMove(e),
      gripUp: () => this.gripUp(),
      gripReset: () => this.gripReset(),
      gripKey: (e) => this.gripKey(e),

      query: s.query,
      setQuery: (e) => this.setState({ query: e.target.value }),
      tabThumb: s.tab === 'frequentes' ? 'p1' : '',
      tabROn: s.tab === 'recentes',
      tabFOn: s.tab === 'frequentes',
      tabRCls: s.tab === 'recentes' ? 'on' : '',
      tabFCls: s.tab === 'frequentes' ? 'on' : '',
      showRecentes: () => this.setState({ tab: 'recentes' }),
      showFrequentes: () => this.setState({ tab: 'frequentes' }),
      visible: visible,
      listH: Math.max(Math.min(visible.length, 2), 1) * 64,
      emptyOn: visible.length === 0,
      emptyText: s.tab === 'frequentes' && !s.query.trim() ? 'Nada fixado ainda.' : 'Nenhuma tarefa encontrada.',
      toast: s.toast,
      toastOn: !!s.toast,
      goHome: () => this.goHome(),
      goNew: () => this.setState({ screen: 'new', anim: 'in-fwd', draftTitle: '', draftProject: 'Projeto A', freshId: 0, toast: '' }),

      sel: sel,
      statusOpen: s.statusOpen,
      chevCls: s.statusOpen ? 'open' : '',
      toggleStatus: () => this.setState({ statusOpen: !s.statusOpen }),
      draftStatusLabel: labels[s.draftStatus],
      draftStatusCls: 's-' + s.draftStatus,
      statusOptions: ['planejamento', 'afazer', 'desenvolvendo', 'revisar', 'concluido'].map((k) => ({
        label: labels[k],
        cls: 's-' + k,
        pressed: s.draftStatus === k,
        pick: () => this.setState({ draftStatus: k, statusOpen: false })
      })),
      draftDeadline: s.draftDeadline,
      setDeadline: (e) => this.setState({ draftDeadline: e.target.value }),
      draftOwner: s.draftOwner,
      setOwner: (e) => this.setState({ draftOwner: e.target.value }),
      draftInvolved: s.draftInvolved,
      setInvolved: (e) => this.setState({ draftInvolved: e.target.value }),
      draftTicket: s.draftTicket,
      setTicket: (e) => this.setState({ draftTicket: e.target.value }),
      save: () => this.save(),

      draftTitle: s.draftTitle,
      setTitle: (e) => this.setState({ draftTitle: e.target.value }),
      projThumb: 'p' + projects.indexOf(s.draftProject),
      projectOptions: projects.map((p) => ({
        label: p,
        cls: s.draftProject === p ? 'on' : '',
        pressed: s.draftProject === p,
        pick: () => this.setState({ draftProject: p })
      })),
      createDisabled: !s.draftTitle.trim(),
      create: () => this.create()
    };
  }
}
</script>
